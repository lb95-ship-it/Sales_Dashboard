<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Board</title>
<style>
  /* Standalone shell only. The board itself styles nothing outside its own
     shadow root, so these rules exist purely to give it a full-window box. */
  html,body{height:100%;}
  /* Matches the board's own --bg now that it ships a light theme. */
  body{margin:0; background:#ffffff; overflow:hidden;}
  #board{height:100vh;}
</style>
</head>
<body>
  <div id="board"></div>

  <!-- The account book. Generated by tools/build-book.ps1; never hand-edited.
       Loaded as a plain script rather than fetch() so the board still works over file://. -->
  <script src="data/accounts.js?v=1785987451" charset="utf-8"></script>
  <script src="route-board.js?v=1786692478" charset="utf-8"></script>
  <script>
    RouteBoard.mount(document.getElementById('board'));
  </script>
</body>
</html>
