<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Schedule Builder &middot; Territory Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">

<style>
  /* -----------------------------------------------------------------------
     Schedule Builder's own layout. Tokens, card, pill, button, input and
     section-label all come from shell.css — only the rotation list, the day
     rows, the preview box and the toast are defined here, because they exist
     on this page and nowhere else.
     ----------------------------------------------------------------------- */

  /* Hero — the dial replaces the old "Week N of 6" text eyebrow. */
  .hero { display: flex; align-items: center; gap: var(--s-5); flex-wrap: wrap; }
  #zoneDial { --dial-size: 140px; }
  @media (min-width: 420px) { #zoneDial { --dial-size: 184px; } }
  .hero-caption { display: grid; gap: var(--s-2); flex: 1 1 200px; min-width: 0; }
  .hero-zone { font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.01em; }

  /* Week navigation */
  .week-nav { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
  .week-nav .btn { flex: 0 0 auto; }
  .week-nav-label {
    flex: 1;
    text-align: center;
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    color: var(--ink-light);
  }
  .week-nav-label.is-offset { color: var(--teal); font-weight: 500; }

  /* Rotation list + day list share a bare list-card shell */
  .list-card {
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .week-row {
    display: flex;
    align-items: flex-start;
    gap: var(--s-4);
    padding: var(--s-3) var(--s-4);
    border-bottom: 1px solid var(--rule);
  }
  .week-row:last-child { border-bottom: none; }
  .week-row.is-current { background: var(--teal-dim); }
  .week-marker {
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    color: var(--ink-light);
    min-width: 18px;
    padding-top: 3px;
    flex-shrink: 0;
  }
  .week-row.is-current .week-marker { color: var(--teal-deep); font-weight: 500; }
  .week-content { flex: 1; min-width: 0; }
  .week-daterange {
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    color: var(--ink-light);
  }
  .week-row.is-current .week-daterange { color: var(--teal-deep); }
  .week-zone { font-size: var(--fs-base); font-weight: 500; line-height: 1.3; }
  .week-row.is-current .week-zone { color: var(--teal-deep); }
  .week-followup { font-size: var(--fs-sm); color: var(--ink-light); }

  /* Map actions, two per rotation row. They live inside the row rather than
     in a toolbar because the route they act on is the row you are reading. */
  .week-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s-2);
    margin-top: var(--s-2);
  }
  .week-actions .btn { flex: 0 0 auto; }

  .daily-row {
    display: flex;
    align-items: center;
    padding: 0 var(--s-4);
    border-bottom: 1px solid var(--rule);
    min-height: 48px;
  }
  .daily-row:last-child { border-bottom: none; }
  .daily-row.is-today { background: var(--teal-dim); }
  .day-pill {
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    font-weight: 500;
    color: var(--ink-mid);
    min-width: 24px;
    flex-shrink: 0;
  }
  .daily-row.is-today .day-pill { color: var(--teal-deep); }
  .day-date-str {
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    color: var(--ink-light);
    min-width: 38px;
    flex-shrink: 0;
    margin-left: var(--s-2);
  }
  .day-sep { color: var(--rule); margin: 0 var(--s-2); flex-shrink: 0; }
  /* --rule vanishes against the today row's teal tint */
  .daily-row.is-today .day-sep { color: rgba(26,107,114,0.35); }
  .day-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: var(--fs-sm);
    padding: var(--s-3) 0;
    outline: none;
  }
  .day-input::placeholder { color: var(--ink-faint); }
  .daily-row.is-today .day-input::placeholder { color: rgba(26,107,114,0.5); }
  .day-input:focus { box-shadow: none; }
  .daily-row:focus-within { box-shadow: inset 2px 0 0 var(--teal); }

  .btn-row { display: flex; gap: var(--s-3); margin: var(--s-5) 0; }
  .btn-row .btn { flex: 1; min-height: 46px; }

  .preview-box {
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    padding: var(--s-4);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    line-height: 1.85;
    color: var(--ink-mid);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .anchor-row { display: flex; align-items: center; gap: var(--s-3); }
  .anchor-row label {
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    white-space: nowrap;
  }
  .anchor-row input[type="date"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    color: var(--teal);
    outline: none;
    cursor: pointer;
  }

  /* Toast. Page-scoped for now — if Sales or Prescriptions need one in Phase
     4/5, promote it to shell.css rather than copying it a third time. */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--nav-h) + var(--s-5) + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--white);
    font-size: var(--fs-sm);
    font-weight: 500;
    padding: var(--s-2) var(--s-5);
    border-radius: var(--r-pill);
    opacity: 0;
    transition: opacity 180ms ease, transform 180ms ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (min-width: 900px) {
    .toast { bottom: var(--s-6); left: calc(50% + (var(--sidebar-w) / 2)); }
  }
</style>
</head>

<body data-page="route">
<a class="skip-link" href="#main">Skip to content</a>

<main class="page" id="main">

  <header class="page-head">
    <h1>Schedule Builder</h1>
    <span class="eyebrow mono" id="todayLabel"></span>
  </header>

  <!-- Two pages, one pillar. This bar looks like the sub-tabs it replaced and
       behaves like navigation, because that is what it now is: the board and
       the schedule were splitting one screen between them and neither had the
       room. The nav rail still shows a single "Route" tab for both. -->
  <nav class="subtabs" aria-label="Route planning pages">
    <a href="route-board.html">Route Board</a>
    <a href="route-planning.html" aria-current="page">Schedule Builder</a>
  </nav>

  <div class="card">
    <div class="hero">
      <div id="zoneDial"></div>
      <div class="hero-caption">
        <span class="eyebrow mono">Primary zone</span>
        <span class="hero-zone" id="heroZone"></span>
        <span class="pill pill-accent" id="heroFollowup"></span>
        <span class="mono" style="font-size:var(--fs-sm); color:var(--ink-light);"
              id="heroDates"></span>
      </div>
    </div>
  </div>

  <p class="section-label"><span>Week</span></p>

  <div class="week-nav">
    <button class="btn" type="button" id="prevWeek">&larr; Prev</button>
    <span class="week-nav-label" id="weekNavLabel" aria-live="polite"></span>
    <button class="btn" type="button" id="nextWeek">Next &rarr;</button>
  </div>

  <p class="section-label"><span>6-week rotation</span></p>
  <div class="list-card" id="scheduleBlock"></div>

  <p class="section-label"><span id="dailyLabel">This week</span></p>
  <div class="list-card" id="dailyBlock"></div>

  <div class="btn-row">
    <button class="btn btn-primary" type="button" id="copyBtn">Copy for Email</button>
    <button class="btn" type="button" id="calBtn">Open Calendar</button>
  </div>

  <p class="section-label"><span>Email preview</span></p>
  <div class="preview-box" id="previewBox"></div>

  <p class="section-label"><span>Cycle</span></p>
  <div class="card" style="padding:var(--s-4);">
    <div class="anchor-row">
      <label for="anchorInput">Cycle start</label>
      <input type="date" id="anchorInput">
    </div>
  </div>
  <p class="hint" style="text-align:center; margin-top:var(--s-2);">
    Set to the Monday your cycle begins &mdash; snaps to the nearest Monday.
  </p>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data-store.js?v=1788244374"></script>
<script src="assets/js/shell.js?v=1788054532"></script>
<script>
/* ===========================================================================
   Schedule Builder — page-scoped. Nothing here is shared with other tools;
   the only cross-page contract is the th_* keys written through Store.

   Migrated from the standalone Territory Schedule tool. Behaviour is
   unchanged apart from the three things Phase 2 exists to add:
     1. Routes and cycle anchor now persist (they were in-memory only).
     2. Inputs save on typing, so changing the anchor no longer wipes them.
     3. th_schedule_summary is written for Home.
   =========================================================================== */
(function () {
  'use strict';

  /* --- Zone rotation, in cycle order -------------------------------------
     Week 1 is Waco/East Austin. The array previously started at North West
     Austin, which put Waco at week 6 — one full rotation out of step with the
     real schedule. Corrected by rotating the array, NOT by moving the anchor:
     both fix the phase, but the anchor is a real date you set and the order is
     what was wrong.

     Every primary -> followup pairing is unchanged by the rotation. That is
     not luck: the follow-up territory is always the zone three weeks away, and
     with six zones +3 and -3 are the same position, so rotating the list
     carries each pair with it.
     ---------------------------------------------------------------------- */
  /* `mapList` is the Google Maps saved-list share link for that route, and the
     "View on Map" button opens it verbatim. Paste one URL per route between
     the quotes below — Maps' own Share > Copy link on the saved list. Nothing
     generates or validates these; a route left empty renders its button
     disabled rather than opening a broken link. */
  var ZONES = [
    { primary: 'Waco/East Austin',     followup: 'North Central Austin',
      mapList: 'https://maps.app.goo.gl/NdmU7pQVdi8XgJzR7' },
    { primary: 'North West Austin',    followup: 'South Central Austin Follow-Ups',
      mapList: 'https://maps.app.goo.gl/QDsrhVS1MSQXWJpX6' },
    { primary: 'Hill Country',         followup: 'Southwest Austin Follow-Ups',
      mapList: 'https://maps.app.goo.gl/6ASQYNCo3NTffoNz6' },
    { primary: 'North Central Austin', followup: 'Waco/East Austin Follow-Ups',
      mapList: 'https://maps.app.goo.gl/sGLsxdqQePtgYubi6' },
    { primary: 'South Central Austin', followup: 'Northwest Austin Follow-Ups',
      mapList: 'https://maps.app.goo.gl/LzMf1o2hF7CcqRmV7' },
    { primary: 'South West Austin',    followup: 'Hill Country Follow-Ups',
      mapList: 'https://maps.app.goo.gl/jmoLYxtDRScqujXAA' }
  ];

  var DAY_LABELS = ['M', 'T', 'W', 'Th', 'F'];

  /* Monday June 22 2026 — the cycle start this tool shipped with. Only used
     the first time; after that the stored anchor wins. */
  var DEFAULT_ANCHOR = '2026-06-22';

  var storedAnchor = Store.schedule.readAnchor();
  var anchorIso = storedAnchor || DEFAULT_ANCHOR;
  /* Persist the default on first run. Leaving it implicit means a later edit
     to DEFAULT_ANCHOR would silently shift the whole rotation for anyone who
     never touched the Cycle start field. */
  var needsAnchorWrite = !storedAnchor;

  var weekOffset = 0;       // 0 = current week, +1 next, -1 last
  var saveTimer = null;

  /* --- Date helpers ------------------------------------------------------ */

  /* Parse YYYY-MM-DD as a LOCAL date. `new Date('2026-06-22')` parses as UTC
     and lands on the 21st for anyone west of Greenwich. */
  function parseIso(s) {
    var p = String(s).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function fmtISO(d) {
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function getMondayOfWeek(date) {
    var d = new Date(date);
    var day = d.getDay();                       // 0 Sun .. 6 Sat
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, n) { var d = new Date(date); d.setDate(d.getDate() + n); return d; }
  function addWeeks(date, n) { return addDays(date, n * 7); }
  function fmt(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }

  function getCycleIndex(monday) {
    var anchorMon = getMondayOfWeek(parseIso(anchorIso));
    /* Round, not floor — a DST boundary inside the span makes the raw
       millisecond division come out at 5.958 weeks instead of 6. */
    var weeks = Math.round((monday - anchorMon) / (7 * 24 * 60 * 60 * 1000));
    return ((weeks % 6) + 6) % 6;
  }

  function currentMonday() { return getMondayOfWeek(new Date()); }
  function getViewedMonday() { return addWeeks(currentMonday(), weekOffset); }

  /* --- Persistence ------------------------------------------------------- */

  function readRoutes(monday) {
    var saved = Store.schedule.readRoutes(fmtISO(monday));
    return Array.isArray(saved) ? saved : [];
  }

  /* Writes the five day inputs for whichever week is on screen. Called before
     any rebuild and on a short debounce while typing — the original only
     saved on week-shift and copy, which is how anchor changes ate routes. */
  function saveCurrentInputs() {
    var inputs = document.querySelectorAll('.day-input');
    if (!inputs.length) return;
    var values = Array.prototype.map.call(inputs, function (el) { return el.value; });
    var key = fmtISO(getViewedMonday());
    /* Don't create an empty record for a week that was never filled in. */
    var hasContent = values.some(function (v) { return v.trim() !== ''; });
    if (hasContent) {
      Store.schedule.writeRoutes(key, values);
    } else if (Store.schedule.readRoutes(key)) {
      Store.remove(Store.KEYS.scheduleRoutes + key);
    }
    /* Editing THIS week's notes changes what Home shows for today, so refresh
       the summary. Other weeks do not affect it. */
    if (weekOffset === 0) writeSummary();
  }

  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCurrentInputs, 400);
  }

  /* Home reads this. It always describes the REAL current week, never the
     week being browsed — otherwise leaving the page on "+3 weeks" would make
     Home advertise the wrong zone. */
  function writeSummary() {
    var mon = currentMonday();
    var idx = getCycleIndex(mon);
    /* Read back rather than reading the DOM: the inputs on screen may belong
       to a different week than the one Home cares about. */
    var days = Store.schedule.readRoutes(fmtISO(mon));
    Store.schedule.writeSummary({
      weekNum:   idx + 1,
      zone:      ZONES[idx].primary,
      followup:  ZONES[idx].followup,
      dateRange: fmt(mon) + ' – ' + fmt(addDays(mon, 4)),
      days:      Array.isArray(days) ? days : []
    });
  }

  /* --- Render ------------------------------------------------------------ */

  function buildSchedule() {
    var today = new Date();
    var viewedMonday = getViewedMonday();
    var cycleIdx = getCycleIndex(viewedMonday);

    document.getElementById('todayLabel').textContent =
      today.toLocaleDateString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    /* Week nav label */
    var navLabel = document.getElementById('weekNavLabel');
    var labelText;
    if (weekOffset === 0)       { labelText = 'This week'; }
    else if (weekOffset === 1)  { labelText = 'Next week'; }
    else if (weekOffset === -1) { labelText = 'Last week'; }
    else if (weekOffset > 0)    { labelText = '+' + weekOffset + ' weeks'; }
    else                        { labelText = weekOffset + ' weeks'; }
    navLabel.textContent = labelText;
    navLabel.className = 'week-nav-label' + (weekOffset === 0 ? '' : ' is-offset');

    document.getElementById('dailyLabel').textContent =
      Math.abs(weekOffset) <= 1 ? labelText : 'Week of ' + fmt(viewedMonday);

    /* Hero + dial */
    var hero = ZONES[cycleIdx];
    Shell.zoneDial(document.getElementById('zoneDial'), { week: cycleIdx + 1, totalWeeks: 6 });
    document.getElementById('heroZone').textContent = hero.primary;
    document.getElementById('heroFollowup').textContent = hero.followup;
    document.getElementById('heroDates').textContent =
      fmt(viewedMonday) + ' – ' + fmt(addDays(viewedMonday, 4));

    /* Rotation — six weeks forward from the week being viewed. The marker
       shows the cycle position (1-6) so it reads consistently with the dial. */
    var sb = document.getElementById('scheduleBlock');
    sb.innerHTML = '';
    for (var i = 0; i < 6; i++) {
      var zi = (cycleIdx + i) % 6;
      var zone = ZONES[zi];
      var ws = addWeeks(viewedMonday, i);
      var row = document.createElement('div');
      row.className = 'week-row' + (i === 0 ? ' is-current' : '');
      row.innerHTML =
        '<div class="week-marker">' + (i === 0 ? '&rarr;' : (zi + 1)) + '</div>' +
        '<div class="week-content">' +
          '<div class="week-daterange">' + fmt(ws) + ' – ' + fmt(addDays(ws, 4)) + '</div>' +
          '<div class="week-zone">' + Shell.escapeHtml(zone.primary) + '</div>' +
          '<div class="week-followup">' + Shell.escapeHtml(zone.followup) + '</div>' +
          routeActions(zi) +
        '</div>';
      sb.appendChild(row);
    }

    /* Day rows */
    var db = document.getElementById('dailyBlock');
    db.innerHTML = '';
    var saved = readRoutes(viewedMonday);
    for (var j = 0; j < 5; j++) {
      var day = addDays(viewedMonday, j);
      var isToday = day.toDateString() === today.toDateString();
      var drow = document.createElement('div');
      drow.className = 'daily-row' + (isToday ? ' is-today' : '');
      drow.innerHTML =
        '<div class="day-pill">' + DAY_LABELS[j] + '</div>' +
        '<div class="day-date-str">' + fmt(day) + '</div>' +
        '<div class="day-sep">&ndash;</div>';

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'day-input';
      input.placeholder = 'Add route…';
      input.value = saved[j] || '';
      input.setAttribute('aria-label',
        day.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + ' route');
      input.addEventListener('input', function () { updatePreview(); queueSave(); });
      drow.appendChild(input);
      db.appendChild(drow);
    }

    updatePreview();
    document.getElementById('anchorInput').value = fmtISO(getMondayOfWeek(parseIso(anchorIso)));
  }

  /* --- Email text -------------------------------------------------------- */

  function buildCopyText() {
    var viewedMonday = getViewedMonday();
    var cycleIdx = getCycleIndex(viewedMonday);
    var lines = [];

    for (var i = 0; i < 6; i++) {
      var zone = ZONES[(cycleIdx + i) % 6];
      var ws = addWeeks(viewedMonday, i);
      lines.push(fmt(ws) + ' - ' + fmt(addDays(ws, 4)) + ' ' +
                 zone.primary + ' (' + zone.followup + ')');
    }
    lines.push('');

    var inputs = document.querySelectorAll('.day-input');
    for (var j = 0; j < 5; j++) {
      var route = inputs[j] ? inputs[j].value.trim() : '';
      lines.push('(' + DAY_LABELS[j] + ') ' + fmt(addDays(viewedMonday, j)) + ' - ' + route);
    }
    return lines.join('\n');
  }

  function updatePreview() {
    document.getElementById('previewBox').textContent = buildCopyText();
  }

  function copySchedule() {
    saveCurrentInputs();
    var text = buildCopyText();
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast('Copied ✓'); },
        function () { fallback(); showToast('Copied ✓'); }
      );
    } else {
      fallback();
      showToast('Copied ✓');
    }
  }

  /* --- Calendar ---------------------------------------------------------- */

  /* Unchanged from the original: try the iOS calendar scheme, and if the page
     is still in the foreground a second later, assume it did nothing and hand
     over an .ics file instead. */
  function openCalendar() {
    window.open('calshow://', '_self');
    setTimeout(function () { if (!document.hidden) exportICS(); }, 1000);
  }

  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
                    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }

  function exportICS() {
    var viewedMonday = getViewedMonday();
    var cycleIdx = getCycleIndex(viewedMonday);
    /* DTSTAMP is required on every VEVENT by RFC 5545. The original omitted
       it; Google tolerates that, stricter importers reject the file. */
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0',
                 'PRODID:-//OCuSOFT Territory//EN', 'CALSCALE:GREGORIAN'];

    for (var i = 0; i < 6; i++) {
      var zone = ZONES[(cycleIdx + i) % 6];
      var ws = addWeeks(viewedMonday, i);
      var ds = fmtISO(ws).replace(/-/g, '');
      /* DTEND is exclusive for all-day events, so Saturday spans Mon-Fri. */
      var de = fmtISO(addDays(ws, 5)).replace(/-/g, '');
      lines.push('BEGIN:VEVENT',
        'UID:ocusoft-' + ds + '@territory',
        'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + ds,
        'DTEND;VALUE=DATE:' + de,
        'SUMMARY:' + icsEscape(zone.primary + ' (' + zone.followup + ')'),
        'END:VEVENT');
    }
    lines.push('END:VCALENDAR');

    var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'territory_schedule.ics';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Calendar file downloaded');
  }

  /* --- Route maps ---------------------------------------------------------
     Two links per route, both built out of data that already exists.

     "View on Map" is the route's saved Maps list — a link Maps itself
     produces, pasted into ZONES at the top of this file. Nothing is built.

     "Start Route" is a multi-stop directions link assembled from the pins
     filed under that route in `th_pins`, which the Accounts > Master workbook
     upload parks there. First pin is the origin, last is the destination, the
     rest are waypoints, in sheet order — the order the route is already
     sorted in. No new storage: this reads the pins and nothing else.

     The Pins sheet carries NO street-address column, only each place's name,
     its Maps URL and its place ID. So a stop is resolved in the order that
     loses the least precision: coordinates lifted out of the Maps URL when
     they are in there, else the name pinned to its place ID, else the bare
     name for Maps to geocode. The bare name is last because it is the only
     one of the three that can land on the wrong clinic.
     ---------------------------------------------------------------------- */

  /* Google Maps will not route more than ten stops. Past that the link is
     rejected outright, so a long route opens as its first ten and says so
     rather than doing nothing. */
  var MAX_STOPS = 10;

  /* The two buttons under a rotation row. `zi` is the index into ZONES and is
     what the click handler reads back: the row's dates change with the week
     being viewed, the route it names does not. */
  function routeActions(zi) {
    var zone = ZONES[zi];
    var name = Shell.escapeHtml(zone.primary);
    return '<div class="week-actions">' +
      '<button type="button" class="btn btn-sm" data-maplist="' + zi + '"' +
        (zone.mapList ? '' : ' disabled') +
        ' aria-label="View ' + name + ' on the map"' +
        ' title="' + (zone.mapList
          ? 'Open the saved Maps list for ' + name
          : 'No saved Maps list link for ' + name + ' yet') + '">' +
        'View on Map</button>' +
      '<button type="button" class="btn btn-sm" data-startroute="' + zi + '"' +
        ' aria-label="Start the ' + name + ' route"' +
        ' title="Driving directions through the pins filed under ' + name + '">' +
        'Start Route</button>' +
      '</div>';
  }

  /* Pins filed under a route, in sheet order. Territory spellings differ
     between the workbook and this page, so both sides go through
     Shell.zoneByName() first; the raw-text compare is the fallback for a
     spelling that list has never seen. */
  function pinsForZone(zoneName) {
    var pins = Store.pins.read();
    var rows = (pins && Array.isArray(pins.rows)) ? pins.rows : [];
    var want = Shell.zoneByName(zoneName);
    return rows.filter(function (r) {
      var z = Shell.zoneByName(r.territory);
      if (want && z) return z.id === want.id;
      return String(r.territory || '').trim().toLowerCase() ===
             String(zoneName || '').trim().toLowerCase();
    });
  }

  /* lat,lng out of a Maps URL. Three shapes turn up in the export:
     .../@30.26,-97.74,17z  ·  !3d30.26!4d-97.74  ·  ?q=30.26,-97.74 (or ll=).
     Returns '' for a cid or place link, which carries no coordinates. */
  function coordsFromUrl(url) {
    var s = String(url || '');
    var m = s.match(/[?&](?:q|ll|daddr|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i) ||
            s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) ||
            s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    return m ? m[1] + ',' + m[2] : '';
  }

  function placeIdFromUrl(url) {
    var m = String(url || '').match(/(?:place_id[:=]|query_place_id=)([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }

  /* One pin -> { text, placeId }. `text` is what goes in the URL; `placeId`
     only sharpens it, and is dropped when the text is already coordinates. */
  function stopFromPin(pin) {
    var coords = coordsFromUrl(pin.mapsUrl);
    if (coords) return { text: coords, placeId: '' };
    return {
      text: String(pin.title || pin.label || '').trim(),
      placeId: String(pin.placeId || '').trim() || placeIdFromUrl(pin.mapsUrl)
    };
  }

  function directionsUrl(stops) {
    var origin = stops[0];
    var dest   = stops[stops.length - 1];
    var mid    = stops.slice(1, -1);
    var parts  = ['api=1', 'travelmode=driving',
                  'origin=' + encodeURIComponent(origin.text),
                  'destination=' + encodeURIComponent(dest.text)];
    if (origin.placeId) parts.push('origin_place_id=' + encodeURIComponent(origin.placeId));
    if (dest.placeId)   parts.push('destination_place_id=' + encodeURIComponent(dest.placeId));
    if (mid.length) {
      parts.push('waypoints=' + mid.map(function (s) {
        return encodeURIComponent(s.text);
      }).join('|'));
      /* waypoint_place_ids has to line up with waypoints one for one, so it is
         all of them or none: a partial list shifts every stop after the gap
         onto somebody else's place ID. */
      if (mid.every(function (s) { return !!s.placeId; })) {
        parts.push('waypoint_place_ids=' + mid.map(function (s) {
          return encodeURIComponent(s.placeId);
        }).join('|'));
      }
    }
    return 'https://www.google.com/maps/dir/?' + parts.join('&');
  }

  function openMapList(zi) {
    var zone = ZONES[zi];
    if (!zone || !zone.mapList) { showToast('No saved Maps list for this route yet'); return; }
    window.open(zone.mapList, '_blank', 'noopener');
  }

  function startRoute(zi) {
    var zone = ZONES[zi];
    if (!zone) return;
    var pins = pinsForZone(zone.primary);
    if (!pins.length) {
      showToast('No pins for ' + zone.primary + ' — upload the workbook first');
      return;
    }
    var stops = pins.map(stopFromPin).filter(function (s) { return !!s.text; });
    if (!stops.length) { showToast('No usable locations on these pins'); return; }
    /* One stop is not a route. Open the pin itself rather than directions
       that start and end in the same parking lot. */
    if (stops.length === 1) {
      window.open(pins[0].mapsUrl || directionsUrl([stops[0], stops[0]]), '_blank', 'noopener');
      return;
    }
    var trimmed = stops.length > MAX_STOPS;
    if (trimmed) stops = stops.slice(0, MAX_STOPS);
    window.open(directionsUrl(stops), '_blank', 'noopener');
    showToast(trimmed
      ? 'First ' + MAX_STOPS + ' stops — Maps routes no more than that'
      : stops.length + ' stops on ' + zone.primary);
  }

  /* --- Anchor ------------------------------------------------------------ */

  function onAnchorChange() {
    var val = document.getElementById('anchorInput').value;
    if (!val) return;
    saveCurrentInputs();                       // was missing — this ate routes
    anchorIso = fmtISO(getMondayOfWeek(parseIso(val)));
    Store.schedule.writeAnchor(anchorIso);
    buildSchedule();
    writeSummary();                            // zone for the current week moved
    showToast('Cycle start updated');
  }

  /* --- Toast ------------------------------------------------------------- */

  var toastTimer;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* --- Wiring ------------------------------------------------------------ */

  function shiftWeek(delta) {
    saveCurrentInputs();
    weekOffset += delta;
    buildSchedule();
  }

  Shell.ready(function () {
    document.getElementById('prevWeek').addEventListener('click', function () { shiftWeek(-1); });
    document.getElementById('nextWeek').addEventListener('click', function () { shiftWeek(1); });
    document.getElementById('copyBtn').addEventListener('click', copySchedule);
    document.getElementById('calBtn').addEventListener('click', openCalendar);
    document.getElementById('anchorInput').addEventListener('change', onAnchorChange);

    /* Delegated, because the rotation rows are rebuilt on every week change
       and re-binding six pairs of buttons each time is how listeners leak. */
    document.getElementById('scheduleBlock').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      if (btn.hasAttribute('data-maplist'))    openMapList(+btn.getAttribute('data-maplist'));
      if (btn.hasAttribute('data-startroute')) startRoute(+btn.getAttribute('data-startroute'));
    });

    /* Catch the last keystrokes if the debounce hasn't fired yet. pagehide
       covers the iOS Safari case, where beforeunload is unreliable. */
    window.addEventListener('pagehide', saveCurrentInputs);
    window.addEventListener('beforeunload', saveCurrentInputs);

    if (!Store.available) {
      showToast('Storage unavailable — notes won’t persist');
    }

    if (needsAnchorWrite) Store.schedule.writeAnchor(anchorIso);

    buildSchedule();
    writeSummary();
  });

})();
</script>
</body>
</html>
